name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/deploy.yml'
      - '.gitignore'
      - 'app.js'
      - 'audit/full-content/**'
      - 'course-taxonomy.js'
      - 'data.js'
      - 'icon-*.png'
      - 'icon.svg'
      - 'index.html'
      - 'manifest.json'
      - 'og.png'
      - 'package*.json'
      - 'playback-core.js'
      - 'playwright.config.mjs'
      - 'salsa_course.js'
      - 'scripts/playback-test-server.mjs'
      - 'scripts/stage-pages.mjs'
      - 'scripts/validate-pages-package.mjs'
      - 'scripts/validate-playback.mjs'
      - 'scripts/validate-content-audit.mjs'
      - 'scripts/validate-site.mjs'
      - 'style.css'
      - 'summaries/**'
      - 'sw-register.js'
      - 'sw.js'
      - 'tests/**'
  # This check is required by main protection, so every pull request must report it.
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Pages package check
    runs-on: ubuntu-latest
    steps:
      - name: Check out web sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate static site
        run: |
          node --check app.js
          node --check course-taxonomy.js
          node --check playback-core.js
          node --check sw.js
          node scripts/validate-site.mjs
          node scripts/validate-playback.mjs
          node scripts/validate-content-audit.mjs
          npm run test:playback
          node scripts/validate-pages-package.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload isolated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
